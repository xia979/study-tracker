<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker - 学习打卡器</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>我的学习打卡器</h1>
        <p class="subtitle">每天进步一点点。</p>

        <form id="task-form">
            <input type="text" id="task-input" placeholder="输入今天的学习任务" autocomplete="off">
            <button type="submit">添加任务</button>
        </form>

        <p id="task-summary">已完成 0 项，共 0 项任务</p>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <ul id="task-list"></ul>
    </main>
</body>

</html>
